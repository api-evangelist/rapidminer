aid: rapidminer
name: Rapidminer
description: >-
  RapidMiner (now Altair RapidMiner / Altair AI) is a data science and machine
  learning platform that unites data preparation, machine learning, and
  predictive model deployment in a visual, low-code environment. The developer
  surface is centered on the official `rapidminer` Python package for
  interacting with Altair AI Studio and Altair AI Hub — reading and writing
  data, running and scheduling processes, managing git-based versioned projects
  and connections, and calling deployed Web API and Scoring endpoints — plus a
  Java/Python extension SDK for building custom operators. AI Hub authenticates
  via OAuth (offline token against a Keycloak-style authentication server). The
  company was surfaced as a portfolio company of Earlybird; RapidMiner was
  acquired by Altair, now part of Siemens.
